name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      TRIAGE_PROVIDER: simulated
      DATABASE_URL: postgresql+asyncpg://civicpulse:change-me@localhost:5432/civicpulse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test tools
        run: pip install ".[dev]"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest tests -q
      - name: Export current OpenAPI contract
        run: python -m scripts.export_openapi
      - name: Assert checked-in OpenAPI is current
        run: git diff --exit-code -- openapi.json

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint, test, and build
        run: |
          npm run lint
          npm run test
          npm run build

  openapi-contract:
    name: OpenAPI client contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install contract tooling
        run: |
          pip install "./backend"
          npm --prefix frontend ci
      - name: Export backend schema and validate generated frontend types
        run: |
          cd backend
          python -m scripts.export_openapi
          cd ../frontend
          npm run check:api
          cd ..
          git diff --exit-code -- backend/openapi.json frontend/src/api/openapi.generated.ts

  containers:
    name: Container build and scan
    runs-on: ubuntu-24.04
    needs: [backend, frontend, openapi-contract]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --tag civicpulse-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag civicpulse-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-backend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: civicpulse-frontend:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Validate Compose model
        run: docker compose -f compose.yaml config --quiet

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    needs: [containers]
    env:
      TRIAGE_PROVIDER: simulated
      FRONTEND_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Launch stack
        run: docker compose -f compose.yaml up --build --wait --wait-timeout 180
      - name: Check frontend proxy and API readiness
        run: |
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/
          curl --fail --retry 10 --retry-delay 2 http://localhost:8080/api/stats
      - name: Print service logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.yaml down --volumes --remove-orphans
