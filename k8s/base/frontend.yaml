apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: civicpulse-frontend:dev
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              # Nginx sends literal DNS queries, unlike a shell resolver, so
              # use the fully qualified in-cluster Service name.
              value: backend.civicpulse.svc.cluster.local:8000
            - name: NGINX_RESOLVER
              value: 10.96.0.10
            - name: NGINX_ENVSUBST_FILTER
              value: API_UPSTREAM|NGINX_RESOLVER
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
